name: release

# Tag-driven: push v1.0.0 and this builds the AppImage and attaches it to a
# GitHub release (F12). The release is created as a DRAFT, so the notes can
# be written before anyone sees it.
#
# A manual run builds and checks the bundle but publishes NOTHING: the publish
# step is guarded on a tag ref. It used to run `gh release create` with
# GITHUB_REF_NAME, which on a branch dispatch means the branch name — that is
# how a git tag named `main` ended up beside the branch of the same name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A tag push and a manual dispatch otherwise race on the same release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match the tauri version pinned in src-tauri/Cargo.lock. Upstream
  # ships a prebuilt CLI for this exact tag; building it from source cost
  # ~6.5 minutes of every release run.
  TAURI_CLI_VERSION: 2.12.4

jobs:
  appimage:
    # Deliberately not ubuntu-latest. An AppImage is only as portable as the
    # glibc it was linked against, so it is built on the oldest runner that
    # still carries webkit2gtk 4.1.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      # Fails the release before the build, not after. packaging/arch/PKGBUILD
      # hardcodes pkgver and builds its source URL from v$pkgver, so a drift
      # between these three is a 404 for every Arch user. That is not
      # hypothetical: v1.0 was tagged with two components, so the PKGBUILD
      # asked for v1.0.0.tar.gz and got a 404. See "Release tags carry three
      # components" in DECISIONS.md.
      - name: PKGBUILD agrees with the tag and the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          appver=$(jq -r .version src-tauri/tauri.conf.json)
          tagver="${GITHUB_REF_NAME#v}"
          echo "pkgver=$pkgver  tauri.conf.json=$appver  tag=$tagver"
          if [ "$pkgver" != "$appver" ]; then
            echo "PKGBUILD pkgver ($pkgver) != tauri.conf.json version ($appver)" >&2
            exit 1
          fi
          if [ "$pkgver" != "$tagver" ]; then
            echo "PKGBUILD pkgver ($pkgver) != tag ($tagver)" >&2
            exit 1
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config file

      # The key carries the commit, so every run saves a fresh cache: with a
      # fixed key, actions/cache writes only on a miss, which freezes the
      # first cache forever while restore-keys hide that it has gone stale.
      # ~/.rustup is cached too — rust-toolchain.toml pins 1.97.1, which the
      # runner does not ship and would otherwise download on first use.
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
            src-tauri/target
          key: release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-
            release-cargo-

      # Prebuilt, from tauri's own release — not a third-party action, and
      # pinned to the version above rather than whatever "^2" resolves to.
      - name: Install tauri-cli
        run: |
          set -euo pipefail
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          curl -fsSL "$url" | tar -xz -C "$HOME/.cargo/bin" cargo-tauri
          cargo tauri --version

      - name: Build AppImage
        # linuxdeploy ships as an AppImage itself and needs FUSE, which CI
        # runners do not have. Extracting instead of mounting is the
        # supported way around that.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build --bundles appimage -- --locked

      - name: Publish draft release
        # Tags only. A branch dispatch has proved the build by this point,
        # which is all it is for.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          bundles=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#bundles[@]} -ne 1 ]; then
            echo "expected exactly one AppImage, found ${#bundles[@]}: ${bundles[*]-none}" >&2
            exit 1
          fi
          appimage="${bundles[0]}"
          dir=$(dirname "$appimage")
          file=$(basename "$appimage")

          # The checksum must name the file as the user will have it on disk.
          # `sha256sum "$appimage"` records the build path, so `sha256sum -c`
          # then fails for everyone who downloads it.
          ( cd "$dir" && sha256sum "$file" > "$file.sha256" )

          # Reuse the release if the tag was pushed once already.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --draft \
                 --title "$GITHUB_REF_NAME" \
                 --notes "AppImage build of $GITHUB_REF_NAME. Arch users: see packaging/arch/PKGBUILD."

          # --clobber only replaces an asset of the same name, so a version
          # bump would leave the previous AppImage sitting beside the new
          # checksum — which reads as a failed integrity check. Drop the old
          # bundle assets first, and only those.
          stale=$(gh release view "$GITHUB_REF_NAME" --json assets \
                    -q '.assets[].name | select(test("\\.AppImage(\\.sha256)?$"))' || true)
          for asset in $stale; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
          done

          gh release upload "$GITHUB_REF_NAME" "$appimage" "$dir/$file.sha256" --clobber

  # The first CI coverage packaging/arch/PKGBUILD has ever had. The appimage
  # job proves nothing about it, so a bad source URL or a mistyped dependency
  # shipped silently — both of which have happened (DECISIONS.md, "Release
  # tags carry three components" and "The Arch package needs options=(!lto)").
  #
  # Runs in PARALLEL with the AppImage build, not after it: GitHub generates
  # /archive/refs/tags/<tag>.tar.gz from the TAG, so the source exists as soon
  # as this workflow triggers. It does not wait on the release, which is a
  # draft anyway — a broken Arch path cannot reach anyone before the notes are
  # written by hand.
  pkgbuild:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      # actions/checkout shells out to git when it is present; install it
      # first so the checkout is a clone rather than a tarball fetch.
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v5

      # makepkg refuses to run as root, by design.
      - name: Create a build user
        run: |
          set -euo pipefail
          useradd -m build
          chown -R build packaging/arch

      # --noprepare: prepare() runs `cargo fetch --locked`, which would drag
      #   Rust and the whole registry into this container to prove nothing
      #   this job is about.
      # --nodeps: nothing is compiled here, and the dependency NAMES are
      #   checked in the next step without installing them.
      # The directory assertion is the real point. A tag whose name does not
      # match pkgver downloads something that extracts to the wrong directory,
      # which is the failure v1.0 shipped with.
      - name: Source downloads and extracts to the expected directory
        run: |
          set -euo pipefail
          su build -c 'cd packaging/arch && makepkg -o --noprepare --nodeps --noconfirm'
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          dir="packaging/arch/src/pve-desk-$pkgver"
          if [ ! -d "$dir" ]; then
            echo "expected the tarball to extract to $dir; found:" >&2
            ls -1 packaging/arch/src >&2
            exit 1
          fi
          if [ ! -f "$dir/src-tauri/Cargo.toml" ]; then
            echo "$dir has no src-tauri/Cargo.toml — wrong tree?" >&2
            exit 1
          fi
          echo "ok: $dir"

      # Catches a typo in depends/makedepends without installing a single
      # package. Version constraints are stripped so glibc>=2.3 still resolves
      # to glibc.
      #
      # `pacman -Si` is the wrong tool here and was the first thing tried:
      # it matches package NAMES only, so `cargo` fails — on Arch that is a
      # `provides` of `rust`, not a package. `-Sddp --print-format` resolves
      # provides and prints rather than installs; -dd skips the dependency
      # resolution we do not need. Verified locally against all eight
      # declared names, and against webkit2gtk-4.2 as a negative control.
      - name: Every declared dependency exists in the repos
        run: |
          set -euo pipefail
          su build -c 'cd packaging/arch && makepkg --printsrcinfo' \
            | sed -n 's/^[[:space:]]*\(make\)\?depends = //p' \
            | sed 's/[<>=].*//' | sort -u > /tmp/deps
          cat /tmp/deps
          # `pipefail` above is load-bearing: the resolver is piped into
          # head, and without it the pipeline reports head's status, so a
          # missing package passes silently with an empty provider. Measured
          # both ways before committing this.
          while read -r d; do
            provider=$(pacman -Sddp --print-format '%n' --noconfirm "$d" 2>/dev/null | head -1) \
              || { echo "nothing provides: $d" >&2; exit 1; }
            echo "  $d -> $provider"
          done < /tmp/deps
