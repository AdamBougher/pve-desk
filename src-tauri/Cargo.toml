[package]
name = "pve-desk"
version = "0.1.0"
edition = "2021"
description = "Desktop client for Proxmox VE"
license = "MIT"

[lib]
name = "pve_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is required for Window::add_child, i.e. more than one webview in
# a window (F14). It is an unstable API surface by Tauri's own labelling, so
# the version stays pinned to a minor release rather than floating.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
dirs = "6"
# HTTP client for the Proxmox API (rustls, no OpenSSL dependency)
# native-roots, not webpki-roots: the API client must honour a CA imported
# into the OS trust store (F17 Q17.2). webpki-roots would ignore it, so the
# webview would trust the node while this client refused it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["time"] }
# Certificate verification for the API client (F3). All three are already in
# the dependency tree via reqwest, so declaring them direct adds no new code.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
sha2 = "0.10"

# Per-platform keyring backend. `secrets.rs` is identical on all three; only
# the backend feature changes (F17).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Linux-only: reach the underlying WebKitGTK webview so the admin panel can
# pin the node's self-signed certificate (F4). Already in the tree via tauri;
# the feature set matches tauri's so the types unify.
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
